<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypt Rush</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100e0d; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
      gap: 12px; color: #f6eace; text-align: center; font: 16px system-ui, sans-serif;
    }
    #loading[hidden] { display: none; }
    progress { width: min(60vw, 240px); accent-color: #dca75b; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="0"
    aria-label="Crypt Rush. Press Enter or Space to start, then match the arrow keys."></canvas>
  <div id="loading" role="status">
    <span>Loading Crypt Rush</span>
    <progress max="1" value="0" aria-label="Game loading progress"></progress>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const progress = loading.querySelector("progress");
    canvas.addEventListener("pointerdown", () => canvas.focus({preventScroll: true}));

    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    }, value => {
      progress.value = value;
    }).then(() => {
      loading.hidden = true;
    }).catch(error => {
      loading.textContent = "Could not load Crypt Rush. Reload the page to try again.";
      console.error(error);
    });
  </script>
</body>
</html>
